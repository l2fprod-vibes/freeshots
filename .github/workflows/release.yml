name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Check out Freeshots
        uses: actions/checkout@v4

      # Verify tap access before spending time building and notarizing.
      - name: Check out Homebrew tap
        if: github.ref_type == 'tag'
        uses: actions/checkout@v4
        with:
          repository: l2fprod/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Validate signing configuration
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
          SIGNING_IDENTITY: ${{ vars.DEVELOPER_ID_APPLICATION_IDENTITY }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, for example v0.2.0." >&2
            exit 1
          fi
          for name in CERTIFICATE CERTIFICATE_PASSWORD APPLE_ID APP_PASSWORD TEAM_ID BUNDLE_ID SIGNING_IDENTITY; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Actions configuration value: $name" >&2
              exit 1
            fi
          done
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ -z "$TAP_TOKEN" ]]; then
              echo "Missing required GitHub Actions secret: HOMEBREW_TAP_TOKEN" >&2
              exit 1
            fi
            test -d homebrew-tap/.git
          fi

      - name: Import Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/freeshots-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Build universal signed app
        env:
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.1' }}
          APP_BUILD: ${{ github.run_number }}
          APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
          BUILD_UNIVERSAL: "1"
          CODESIGN_IDENTITY: ${{ vars.DEVELOPER_ID_APPLICATION_IDENTITY }}
        run: |
          APP_VERSION="${APP_VERSION#v}" ./build.sh

      - name: Notarize and package app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            ZIP_NAME="Freeshots-${VERSION}.zip"
          else
            SHORT_SHA="${GITHUB_SHA:0:7}"
            ZIP_NAME="Freeshots-main-${SHORT_SHA}.zip"
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/freeshots-signing.keychain-db"
          mkdir -p dist
          ditto -c -k --keepParent build/Freeshots.app "$RUNNER_TEMP/Freeshots-notarize.zip"
          xcrun notarytool store-credentials freeshots-notary \
            --apple-id "$APPLE_ID" --password "$APP_PASSWORD" --team-id "$TEAM_ID" \
            --keychain "$KEYCHAIN_PATH"
          xcrun notarytool submit "$RUNNER_TEMP/Freeshots-notarize.zip" \
            --wait --keychain-profile freeshots-notary
          xcrun stapler staple build/Freeshots.app
          xcrun stapler validate build/Freeshots.app
          ditto -c -k --keepParent build/Freeshots.app "dist/${ZIP_NAME}"
          shasum -a 256 "dist/${ZIP_NAME}" > "dist/${ZIP_NAME}.sha256"

      - name: Upload main build artifact
        if: github.ref_type == 'branch'
        uses: actions/upload-artifact@v4
        with:
          name: Freeshots-main-${{ github.sha }}
          path: |
            dist/Freeshots-main-*.zip
            dist/Freeshots-main-*.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/Freeshots-${VERSION}.zip" \
            "dist/Freeshots-${VERSION}.zip.sha256" \
            --title "Freeshots ${VERSION}" --generate-notes

      - name: Update Homebrew Cask
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          SHA256="$(awk '{ print $1 }' "dist/Freeshots-${VERSION}.zip.sha256")"
          mkdir -p homebrew-tap/Casks
          sed -e "s/__VERSION__/${VERSION}/g" -e "s/__SHA256__/${SHA256}/g" \
            distribution/freeshots.rb.in > homebrew-tap/Casks/freeshots.rb
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Casks/freeshots.rb
          if ! git -C homebrew-tap diff --cached --quiet; then
            git -C homebrew-tap commit -m "Update Freeshots to ${VERSION}"
            git -C homebrew-tap push origin HEAD
          fi

